# FOOUND heartbeat — the engine's beat.
#
# One run does, in order: (1) synthesis of what clients fed; (2) the sweeps
# (FOOUND proposes Briefs and drafts Candidate pages; nobody has to ask);
# (3) daily editions, when switched on; (4) the queued hunts. Nothing here
# executes an intent the client's confirmed record (or the daily clock) did
# not call for.
#
# THE CLOCK. GitHub's schedule is best-effort (observed: every 2–4.5 h). So
# every run ends by handing the beat to its successor: a `clock` job sleeps
# to the next quarter hour, then dispatches this workflow again with the
# repository's own GITHUB_TOKEN (workflow_dispatch is one of the two events
# that token may raise). No credential, no person. If several runs overlap
# (a schedule tick, a manual run, a database wake), only the oldest sleeping
# clock dispatches; the chain converges to one. The schedule stays as the
# restart of last resort. Migration 014 adds immediacy on top: a queued job
# wakes the engine within seconds, once a dispatch token is in Vault.
#
# The daily enqueue is OFF until FOOUND_DAILY_EDITIONS is set to "1" in the
# repository variables (Settings → Secrets and variables → Actions → Variables).

name: heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"     # best-effort restart of the chain
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the engine is being woken (job:<type> | memory:confirmed | clock | manual)"
        required: false
        default: "manual"

jobs: compile_brief,
# refresh_readiness, propose_brief, first_edition. Nothing runs that a
# client's confirmed intent (or the daily clock) did not call for.
#
# The daily enqueue is OFF until FOOUND_DAILY_EDITIONS is set to "1" in the
# repository's Actions variables — turning it on is the product decision
# "editions arrive every day". Everything else here only executes intents
# already expressed through the app.
#
# PUBLIC REPO: logs are public. Both runners print ids, counts and enums
# only — never statement text, seat titles, URLs, prompts or model output.

name: heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"     # GitHub's clock: best-effort (observed: once in 7 h). Migration 014 is the real one.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the engine is being woken (job:<type> | memory:confirmed | clock | manual)"
        required: false
        default: "manual"

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The group serialises the work, never the waiting: the clock job below
    # sleeps outside it, so a database wake or a manual run is never queued
    # behind a sleeping runner.
    concurrency:
      group: hunt-runner            # never alongside hunt-runner / dry-run
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: >
          pip install requests==2.33.1 anthropic==1.0.0
          pypdf==3.17.4 python-docx==1.2.0
      - name: Synthesis (what clients fed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python synthesis_runner.py
      - name: Propose Briefs and draft Candidate pages (settled Mirrors)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hunt_runner.py --sweep-proposals
      - name: Daily editions (only when switched on)
        if: ${{ vars.FOOUND_DAILY_EDITIONS == '1' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hunt_runner.py --enqueue-daily
      - name: Hunt (queued jobs)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOUND_STATE_DIR: /tmp/foound-state
        run: python hunt_runner.py

  clock:
    # The next beat. Sleeps to the next quarter hour, then dispatches this
    # workflow again. Runs after the beat whatever the beat's outcome, so a
    # failed hunt never stops the clock. Only the oldest sleeping clock among
    # concurrent runs dispatches, so overlapping runs converge to one chain.
    needs: beat
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sleep to the next quarter hour
        run: |
          now=$(date +%s)
          next=$(( (now / 900 + 1) * 900 ))
          wait=$(( next - now ))
          echo "next beat in ${wait}s"
          sleep "$wait"
      - name: Hand the beat on (oldest clock only)
        run: |
          me=${{ github.run_id }}
          oldest=$(gh run list --repo "${{ github.repository }}" --workflow heartbeat.yml \
                    --status in_progress --json databaseId --jq '.[].databaseId' \
                    | sort -n | head -1)
          if [ -n "$oldest" ] && [ "$oldest" -lt "$me" ]; then
            echo "an older beat ($oldest) holds the clock; standing down"
            exit 0
          fi
          gh workflow run heartbeat.yml --repo "${{ github.repository }}" -f reason=clock
          echo "next beat dispatched"
