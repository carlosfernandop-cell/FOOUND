name: Agent readiness

# Permanent regression guard, not a one-time migration script.
#
# Protects the two kinds of correctness separately:
#   structural — no one-person literals in the per-agent path, private-state
#                logic behaves, orchestration wiring works end to end
#   fidelity   — the published edition did not change structurally
#
# Cheap (no network, no secrets, one pip install), so it runs on every push.

on:
  push:
    paths:
      - "job_alerts.py"
      - "foound_agent.py"
      - "foound_state.py"
      - "hunt_runner.py"
      - "test_*.py"
      - "render_edition.py"
      - "tests/**"
      - "golden_edition.html"
      - ".github/workflows/agent-readiness.yml"
      - ".github/workflows/hunt.yml"
      - "sql/011_commission_recovery.sql"
      - "sql/test_migration_011.sql"
      - "sql/dev/run_011_harness.sh"
      - "sql/dev/011_harness_extras.sql"
      - "sql/005_multiuser.sql"
      - "sql/006_jobs.sql"
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Everything compiles
        run: python3 -m py_compile job_alerts.py foound_agent.py foound_state.py hunt_runner.py

      - name: No one-person literals in the per-agent path
        run: python3 test_no_agent_literals.py job_alerts.py

      - name: Private-state module behaves
        run: python3 test_foound_state.py

      - name: Hunt runner vertical slice
        run: python3 test_hunt_runner.py

      - name: Orchestration works end to end
        run: python3 test_main_endtoend.py

      - name: Edition structure unchanged
        run: |
          python3 render_edition.py job_alerts.py /tmp/current.html --normalize
          GOLDEN=""
          [ -f tests/golden_edition.html ] && GOLDEN=tests/golden_edition.html
          [ -f golden_edition.html ] && GOLDEN=golden_edition.html
          if [ -n "$GOLDEN" ]; then
            diff -u "$GOLDEN" /tmp/current.html \
              || { echo "::error::The published edition changed structurally. If intentional, update $GOLDEN."; exit 1; }
          else
            echo "::notice::No golden fixture — commit golden_edition.html to enable this guard."
          fi

  # Disposable Postgres. Never production. Proves migration 011 empirically.
  migration-011:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: foound_011
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run 011 harness (disposable)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: harness
          PGDATABASE: foound_011
          FOOUND_011_KEEP_DB: "1"
        run: bash sql/dev/run_011_harness.sh
